# Development question set for comparing retrieval methods.
#
# Each question's answer key is a (paper_id, snippets) anchor: a chunk counts as
# correct if it comes from that paper and contains any of the snippets. Anchors
# survive re-chunking, unlike chunk ids.
#
# Written by the developer before any of these were searched, and validated only
# for "the snippet exists in some chunk". It is a DEVELOPMENT set: the same person
# built the system and wrote the questions, so it can guide decisions but is not
# the Phase 5 evaluation, whose questions must be written independently and fixed
# before any run.
#
# kind:
#   shared        - the question uses the paper's own wording
#   abbreviation  - the question spells out a term the paper abbreviates (or the reverse)
#   paraphrase    - everyday wording that shares few key terms with the paper

questions:
